name: CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - 'Release'

    steps:
    - name: Install required tools
      run: |
        sudo apt update
        DEBIAN_FRONTEND='noninteractive' sudo apt install -o APT::Install-Suggests=false -qy \
          cmake \
          gcc-arm-none-eabi \
          git \
          make

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Verify Toolchain Installation
      run: |
        cmake --version
        arm-none-eabi-ld --version
        arm-none-eabi-gcc --version

    - name: Configure
      run: |
        cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_TOOLCHAIN_FILE="cmake/arm-none-eabi-gcc.cmake" -B "build"

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

    - name: generate short hash
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Upload dev snapshot
      uses: actions/upload-artifact@v4
      if: ${{ github.event_name != 'schedule'}}
      with:
        name: build_${{steps.date.outputs.date}}_${{steps.vars.outputs.sha_short}}
        path: ${{github.workspace}}/build/*_fw.bin
